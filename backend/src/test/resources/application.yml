server:
  port: 0

spring:
  application:
    name: stayfinder-backend-test

  datasource:
    url: jdbc:h2:mem:stayfinder_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
